<script>
  const BACKEND_URL = "https://ad-ebon.vercel.app/api/trigger_alert";
  const ACCIDENT_THRESHOLD = 25;
  let cameraStream = null;
  let alertSent = false;

  async function start() {
    document.getElementById("status").innerText = "Requesting permissions...";

    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
      document.getElementById("video").srcObject = cameraStream;
    } catch (err) {
      document.getElementById("status").innerText = "Camera permission denied: " + err.message;
      return;
    }

    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      try {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm !== "granted") {
          document.getElementById("status").innerText = "Motion permission denied.";
          return;
        }
      } catch (err) {
        document.getElementById("status").innerText = "Motion permission error: " + err.message;
        return;
      }
    }

    if (typeof DeviceMotionEvent === "undefined") {
      document.getElementById("status").innerText = "This browser does not support motion sensors.";
      return;
    }

    document.getElementById("status").innerText = "Monitoring... (waiting for motion data)";
    window.addEventListener("devicemotion", handleMotion);
  }

  function handleMotion(event) {
    const acc = event.accelerationIncludingGravity;
    if (!acc || (acc.x === null && acc.y === null && acc.z === null)) {
      document.getElementById("status").innerText = "No motion data received from device.";
      return;
    }

    const totalForce = Math.sqrt((acc.x||0) ** 2 + (acc.y||0) ** 2 + (acc.z||0) ** 2);
    document.getElementById("status").innerText =
      `Live force: ${totalForce.toFixed(2)}  (threshold: ${ACCIDENT_THRESHOLD})`;

    if (totalForce > ACCIDENT_THRESHOLD && !alertSent) {
      alertSent = true;
      document.getElementById("status").innerText = "🚨 Accident detected! Sending alert...";
      triggerAlert();
    }
  }

  function capturePhoto() {
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    return canvas.toDataURL("image/jpeg");
  }

  function triggerAlert() {
    const photo = capturePhoto();
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const payload = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, photo };
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      document.getElementById("status").innerText = res.ok ? "✅ Alert sent!" : "❌ Failed to send alert.";
    }, () => {
      document.getElementById("status").innerText = "Location permission denied.";
    });
  }
</script>
